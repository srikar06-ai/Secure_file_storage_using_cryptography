version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: crypto6-mongodb
    restart: unless-stopped
    ports:
      # Bind exclusively to 127.0.0.1 to avoid exposing the database to public interfaces
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-adminSecretPassword123}
      MONGO_INITDB_DATABASE: ${DB_NAME:-secure_file_storage}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    # Launch MongoDB with replica set rs0 enabled on all container interfaces
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test:
        - "CMD"
        - "mongosh"
        - "--port"
        - "27017"
        - "--quiet"
        - "--eval"
        - "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo-init:
    image: mongo:7.0
    container_name: crypto6-mongo-init
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    environment:
      MONGO_ROOT_USER: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-adminSecretPassword123}
    entrypoint:
      - "bash"
      - "-c"
      - |
        echo "Waiting for MongoDB service..."
        until mongosh --host mongodb:27017 --username "$$MONGO_ROOT_USER" --password "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "db.adminCommand('ping').ok" > /dev/null 2>&1; do
          echo "Connecting to mongodb:27017..."
          sleep 2
        done

        echo "Checking Replica Set status..."
        RS_STATUS=$$(mongosh --host mongodb:27017 --username "$$MONGO_ROOT_USER" --password "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "try { rs.status().ok } catch(e) { 0 }")

        if [ "$$RS_STATUS" -ne 1 ]; then
          echo "Initiating Replica Set 'rs0'..."
          mongosh --host mongodb:27017 --username "$$MONGO_ROOT_USER" --password "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --eval "
            rs.initiate({
              _id: 'rs0',
              members: [
                { _id: 0, host: '127.0.0.1:27017' }
              ]
            })
          "
          echo "Replica Set 'rs0' initiated successfully!"
        else
          echo "Replica Set 'rs0' is already active."
        fi

volumes:
  mongodb_data:
    name: crypto6_mongodb_data
  mongodb_config:
    name: crypto6_mongodb_config
